version: 2
updates:
  - package-ecosystem: pub
    directory: /
    versioning-strategy: widen
    schedule:
      interval: weekly
    groups:
      dart-dependencies:
        patterns:
          - '*'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - '*'
